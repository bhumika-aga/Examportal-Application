services:
  app:
    build: .
    container_name: examportal-server
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - JWT_SECRET=examportalsecretkeyfortestingpurposesonly123456
      - JWT_EXPIRATION=36000000
      - CORS_ALLOWED_ORIGINS=http://localhost:5173
      - DB_PASSWORD=password
      - H2_CONSOLE_ENABLED=true
      - SHOW_SQL=true
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/actuator/health" ]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 3
    networks:
      - exam-network

networks:
  exam-network:
    driver: bridge
